name: BiblePlus
options:
  bundleIdPrefix: io.bibleplus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  # Every locale we ship translations for via Resources/Localizable.xcstrings.
  # Must stay in sync with SupportedLanguage.all and the TRANSLATIONS keys in
  # Scripts/generate_localizable_xcstrings.py. If a code is missing here,
  # Xcode won't emit the matching `.lproj` and runtime `Bundle(path:ofType:
  # "lproj")` lookups in LocalizationService return nil.
  developmentLanguage: en
  knownRegions:
    - en
    - es
    - pt-BR
    - pt-PT
    - fr
    - de
    - it
    - nl
    - sv
    - "no"
    - da
    - fi
    - pl
    - cs
    - hu
    - ro
    - el
    - tr
    - ru
    - uk
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - hi
    - bn
    - ur
    - ar
    - he
    - fa
    - id
    - ms
    - th
    - vi
    - tl
    - sw
    - am
    - af
    - yo
    - ha
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.9"
    CURRENT_PROJECT_VERSION: "29"
    GENERATE_INFOPLIST_FILE: true
    SWIFT_EMIT_LOC_STRINGS: "YES"

schemes:
  BiblePlus:
    build:
      targets:
        BiblePlus: all
    run:
      config: Debug
      storeKitConfiguration: BiblePlus/Configuration.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK.git
    from: "2.0.0"
  TikTokBusinessSDK:
    url: https://github.com/tiktok/tiktok-business-ios-sdk.git
    from: "1.6.1"

targets:
  BiblePlus:
    type: application
    platform: iOS
    sources:
      - path: BiblePlus
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
          - "Content/*.json"
      - path: Shared/Content
        includes:
          - "*.json"
        buildPhase: resources
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Backgrounds
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Bible
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bibleplus.app
        INFOPLIST_FILE: BiblePlus/Info.plist
        CODE_SIGN_ENTITLEMENTS: BiblePlus/BiblePlus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: "Bible Plus"
        DEVELOPMENT_TEAM: LRDHWBMA87
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: BiblePlus/BiblePlus.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.bibleplus.shared
    dependencies:
      - target: BiblePlusWidgets
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: TelemetryDeck
        product: TelemetryClient
      - package: TikTokBusinessSDK
        product: TikTokBusinessSDK

  BiblePlusWidgets:
    type: app-extension
    platform: iOS
    product: com.apple.product-type.app-extension
    sources:
      - path: BiblePlusWidgets
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
          - "Content/*.json"
      - path: Shared/Content
        includes:
          - "*.json"
        buildPhase: resources
      # Share the same String Catalog as the app so widget text localizes
      # into the user's chosen language instead of staying English.
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bibleplus.app.widgets
        INFOPLIST_FILE: BiblePlusWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: BiblePlusWidgets/BiblePlusWidgets.entitlements
        SKIP_INSTALL: YES
        PRODUCT_NAME: BiblePlusWidgets
        DEVELOPMENT_TEAM: LRDHWBMA87
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: BiblePlusWidgets/BiblePlusWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.bibleplus.shared
